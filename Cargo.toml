[workspace]
resolver = "3"
members = [
    "engine/*",
    "generation/*",
    "interfaces/*",
    "tools/xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
description = "Deterministic terrain generation primitives, pipelines, runtime, and C ABI."
readme = "README.md"

[workspace.dependencies]
terrakit-core = { path = "engine/terrakit-core", version = "0.0.1" }
terrakit-pipeline = { path = "engine/terrakit-pipeline", version = "0.0.1" }
terrakit-runtime = { path = "engine/terrakit-runtime", version = "0.0.1" }
terrakit-algorithms = { path = "generation/terrakit-algorithms", version = "0.0.1" }
terrakit-builtins = { path = "generation/terrakit-builtins", version = "0.0.1" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }

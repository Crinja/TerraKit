name: Godot Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare Release
    uses: ./.github/workflows/_release-state.yml
    with:
      version_path: interfaces/terrakit-godot/addon/addons/terrakit/plugin.cfg
      version_kind: godot-plugin
      tag_prefix: terrakit-godot-v

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build TerraKit release C ABI
        run: cargo build --locked -p terrakit-c-api --all-features --release

      - name: Build Godot release extension
        working-directory: interfaces/terrakit-godot
        run: >-
          scons
          platform=${{ matrix.platform }}
          target=template_release
          arch=x86_64
          terrakit_profile=release

      - name: Upload platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: godot-bin-${{ matrix.platform }}
          path: interfaces/terrakit-godot/addon/addons/terrakit/bin/${{ matrix.platform }}/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: godot-bin-*
          path: downloaded-binaries
          merge-multiple: false

      - name: Assemble Godot addon
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p package/addons
          cp -R interfaces/terrakit-godot/addon/addons/terrakit package/addons/
          rm -rf package/addons/terrakit/bin
          mkdir -p package/addons/terrakit/bin/linux package/addons/terrakit/bin/windows

          cp -R downloaded-binaries/godot-bin-linux/. package/addons/terrakit/bin/linux/
          cp -R downloaded-binaries/godot-bin-windows/. package/addons/terrakit/bin/windows/

          mkdir -p release-assets
          NAME="terrakit-godot-${VERSION}.zip"
          (cd package && zip -qr "../release-assets/$NAME" addons)
          HASH="$(sha256sum "release-assets/$NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$NAME" > "release-assets/$NAME.sha256"

      - name: Generate scoped release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          {
            echo "TerraKit Godot ${VERSION}"
            echo
            echo "Supports the platforms declared by the packaged GDExtension."
            echo
            echo "## Godot changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$GITHUB_SHA" -- interfaces/terrakit-godot)"
              if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No Godot-path changes recorded."; fi
            else
              echo "- Initial standalone Godot release."
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create \
            "$TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TerraKit Godot $VERSION" \
            --notes-file release-notes.md \
            --latest=false

name: Godot Promote

on:
  push:
    branches: [godot]
  workflow_dispatch:

jobs:
  promote:
    uses: ./.github/workflows/_component-promote.yml
    with:
      component: TerraKit Godot
      branch: godot
      version_path: interfaces/terrakit-godot/addon/addons/terrakit/plugin.cfg
      version_kind: godot-plugin
      tag_prefix: terrakit-godot-v
      scope_mode: include
      scope_pattern: '^(interfaces/terrakit-godot/|\.github/workflows/godot-.*\.ya?ml$)'
    secrets:
      automation_token: ${{ secrets.TERRAKIT_AUTOMATION_TOKEN }}

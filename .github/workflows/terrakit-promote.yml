name: TerraKit Promote

on:
  push:
    branches: [tk]
  workflow_dispatch:

jobs:
  promote:
    uses: ./.github/workflows/_component-promote.yml
    with:
      component: TerraKit
      branch: tk
      version_path: Cargo.toml
      version_kind: cargo-workspace
      tag_prefix: terrakit-v
      scope_mode: exclude
      scope_pattern: '^interfaces/|^\.github/(?!workflows/terrakit-.*\.ya?ml$)|^\.devcontainer/|^\.vscode/|^tools/release/|^docs/|^(README\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|LICENSE|\.gitignore|\.gitattributes|\.gitmodules|\.editorconfig|\.dockerignore|rust-toolchain\.toml)$'
    secrets:
      automation_token: ${{ secrets.TERRAKIT_AUTOMATION_TOKEN }}

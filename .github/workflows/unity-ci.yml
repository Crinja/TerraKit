name: Unity CI

on:
  pull_request:
    branches: [unity, tk, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: target/unity

jobs:
  scope:
    name: Unity Scope
    uses: ./.github/workflows/_component-scope.yml
    with:
      branch: unity
      scope_mode: include
      scope_pattern: '^(interfaces/terrakit-unity/|\.github/workflows/unity-.*\.ya?ml$)'

  validate-source:
    name: Validate Unity Source Package
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate source-only package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="interfaces/terrakit-unity"
          NAME="$(jq -er '.name' "$ROOT/package.json")"
          VERSION="$(jq -er '.version' "$ROOT/package.json")"

          if [ "$NAME" != "com.terrakit.unity" ]; then
            echo "::error::package.json name must be com.terrakit.unity"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unity package version must be stable X.Y.Z SemVer; got '$VERSION'."
            exit 1
          fi

          NATIVE_FILES="$(find "$ROOT" -type f \( \
            -name '*.dll' -o \
            -name '*.so' -o \
            -name '*.dylib' -o \
            -name '*.lib' \
          \) -print)"

          if [ -n "$NATIVE_FILES" ]; then
            echo "::error::Compiled native libraries must not be committed to the Unity source package."
            printf '%s\n' "$NATIVE_FILES"
            exit 1
          fi

          BINARY_META="$(find "$ROOT" -type f \( \
            -name '*.dll.meta' -o \
            -name '*.so.meta' -o \
            -name '*.dylib.meta' -o \
            -name '*.lib.meta' \
          \) -print)"

          if [ -n "$BINARY_META" ]; then
            echo "::error::Binary-specific .meta files are generated by CI and must not be committed."
            printf '%s\n' "$BINARY_META"
            exit 1
          fi

          echo "TerraKit Unity source package is valid ($VERSION)."

  build:
    name: Native Build (${{ matrix.platform }})
    needs: [scope, validate-source]

    # Skip only routes where rebuilding the native backend is redundant.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.head_ref != 'main' &&
          !(
            github.base_ref == 'main' &&
            (
              github.head_ref == 'console' ||
              github.head_ref == 'godot' ||
              github.head_ref == 'maintenance'
            )
          )
        )
      }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: libterrakit.so
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: terrakit.dll
          - os: macos-latest
            platform: macos-universal
            target: universal
            binary: libterrakit.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Rust target
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build TerraKit C ABI
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked -p terrakit-c-api --all-features --release --target "$TARGET"

      - name: Collect native runtime
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p native-out
          cp "$CARGO_TARGET_DIR/$TARGET/release/$BINARY" "native-out/$BINARY"

      - name: Build universal macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked -p terrakit-c-api --all-features --release --target x86_64-apple-darwin
          cargo build --locked -p terrakit-c-api --all-features --release --target aarch64-apple-darwin
          mkdir -p native-out
          lipo -create \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/libterrakit.dylib" \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/libterrakit.dylib" \
            -output native-out/libterrakit.dylib
          lipo -info native-out/libterrakit.dylib

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: unity-native-${{ matrix.platform }}
          path: native-out/${{ matrix.binary }}
          if-no-files-found: error

  package:
    name: Assemble UPM Package
    needs: [validate-source, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-windows-x86_64
          path: native/windows

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-linux-x86_64
          path: native/linux

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-macos-universal
          path: native/macos

      - name: Assemble release-style package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package dist
          mkdir -p package dist
          cp -a interfaces/terrakit-unity/. package/
          rm -f package/.gitignore

          # Runtime/Plugins is generated entirely by CI. Do not rely on
          # placeholder files or pre-existing directories in the source tree.
          rm -rf package/Runtime/Plugins package/Runtime/Plugins.meta
          mkdir -p \
            package/Runtime/Plugins/Windows/x86_64 \
            package/Runtime/Plugins/Linux/x86_64 \
            package/Runtime/Plugins/macOS

          write_folder_meta() {
            local path="$1"
            local guid="$2"
            cat > "$path" <<EOF
          fileFormatVersion: 2
          guid: $guid
          folderAsset: yes
          DefaultImporter:
            externalObjects: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
          }

          write_folder_meta package/Runtime/Plugins.meta 8fa1d5e50bf63e34e9f3e8c5f211003a
          write_folder_meta package/Runtime/Plugins/Windows.meta 1bab37f4e3fb53245893b5320a62a1f8
          write_folder_meta package/Runtime/Plugins/Windows/x86_64.meta d7a2e663645949e38d4ddae1c530ae7d
          write_folder_meta package/Runtime/Plugins/Linux.meta 86a84bd15b444382b8b76a6fc437f81f
          write_folder_meta package/Runtime/Plugins/Linux/x86_64.meta f8c38e64cf3a4eaa8577561fa990f949
          write_folder_meta package/Runtime/Plugins/macOS.meta 69afc309a691444b885663031c01b1fb

          install -Dm755 native/windows/terrakit.dll \
            package/Runtime/Plugins/Windows/x86_64/terrakit.dll
          install -Dm755 native/linux/libterrakit.so \
            package/Runtime/Plugins/Linux/x86_64/libterrakit.so
          install -Dm755 native/macos/libterrakit.dylib \
            package/Runtime/Plugins/macOS/libterrakit.dylib

          cat > package/Runtime/Plugins/Windows/x86_64/terrakit.dll.meta <<'EOF'
          fileFormatVersion: 2
          guid: e7209d2864a84adf9c75c4e5d2cdbdae
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 1
                  Exclude OSXUniversal: 1
                  Exclude Win: 1
                  Exclude Win64: 0
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: x86_64
                  DefaultValueInitialized: true
                  OS: Windows
            - first:
                Standalone: Linux64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 0
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 1
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          cat > package/Runtime/Plugins/Linux/x86_64/libterrakit.so.meta <<'EOF'
          fileFormatVersion: 2
          guid: 71b13022ba8f4e818207832f3d79131d
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 0
                  Exclude OSXUniversal: 1
                  Exclude Win: 1
                  Exclude Win64: 1
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: x86_64
                  DefaultValueInitialized: true
                  OS: Linux
            - first:
                Standalone: Linux64
              second:
                enabled: 1
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 0
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          cat > package/Runtime/Plugins/macOS/libterrakit.dylib.meta <<'EOF'
          fileFormatVersion: 2
          guid: 4d95e918819044c8ae897546dcf8b065
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 1
                  Exclude OSXUniversal: 0
                  Exclude Win: 1
                  Exclude Win64: 1
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: AnyCPU
                  DefaultValueInitialized: true
                  OS: OSX
            - first:
                Standalone: Linux64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 1
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          PACKED="$(npm pack ./package --pack-destination dist --silent)"
          TGZ="dist/$PACKED"

          tar -tzf "$TGZ" | grep -F 'package/Runtime/Plugins/Windows/x86_64/terrakit.dll'
          tar -tzf "$TGZ" | grep -F 'package/Runtime/Plugins/Linux/x86_64/libterrakit.so'
          tar -tzf "$TGZ" | grep -F 'package/Runtime/Plugins/macOS/libterrakit.dylib'

          if tar -tzf "$TGZ" | grep -Eq '\.lib$|/Build~/' ; then
            echo '::error::UPM package contains source-only or non-runtime artifacts.'
            exit 1
          fi

  gate:
    name: Unity Gate
    if: always()
    needs: [scope, validate-source, build, package]
    runs-on: ubuntu-latest

    steps:
      - name: Check Unity CI result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SOURCE_RESULT: ${{ needs.validate-source.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ] || [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::Unity source validation failed."
            exit 1
          fi

          if [ "$BUILD_RESULT" = "success" ] && [ "$PACKAGE_RESULT" = "success" ]; then
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$BUILD_RESULT" = "skipped" ] \
            && [ "$PACKAGE_RESULT" = "skipped" ]; then

            if [ "$HEAD_REF" = "main" ]; then
              echo "Unity native/package jobs skipped for main sync."
              exit 0
            fi

            if [ "$BASE_REF" = "main" ] \
              && { [ "$HEAD_REF" = "console" ] \
                || [ "$HEAD_REF" = "godot" ] \
                || [ "$HEAD_REF" = "maintenance" ]; }; then
              echo "Unity native/package jobs skipped for unrelated component promotion."
              exit 0
            fi
          fi

          echo "::error::Unity CI failed."
          echo "Build:   $BUILD_RESULT"
          echo "Package: $PACKAGE_RESULT"
          exit 1

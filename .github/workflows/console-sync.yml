name: Console Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '21 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    uses: ./.github/workflows/_component-sync.yml
    with:
      branch: console
      component: TerraKit Console
    secrets:
      automation_token: ${{ secrets.TERRAKIT_AUTOMATION_TOKEN }}

name: Console Sync

on:
  workflow_run:
    workflows:
      - TerraKit CI
    types:
      - completed

  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Main Into Console

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin main console --no-tags

      - name: Check whether sync is required
        id: state
        shell: bash
        run: |
          set -euo pipefail

          # If main is already contained in console, there is nothing to sync.
          if git merge-base --is-ancestor origin/main origin/console; then
            echo "Main is already contained in console."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_version() {
            python3 -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["package"]["version"])
          '
          }

          MAIN_VERSION="$(
            git show \
              origin/main:interfaces/terrakit-console/Cargo.toml \
              | read_version
          )"

          CONSOLE_VERSION="$(
            git show \
              origin/console:interfaces/terrakit-console/Cargo.toml \
              | read_version
          )"

          echo "main Console version:    $MAIN_VERSION"
          echo "console Console version: $CONSOLE_VERSION"

          # A differing version means Console is being prepared/promoted.
          # Do not mutate the release candidate by syncing main into it.
          if [ "$MAIN_VERSION" != "$CONSOLE_VERSION" ]; then
            echo "Console has an unreleased version change; sync deferred."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sync=true" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.state.outputs.sync == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TERRAKIT_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base console \
              --head main \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base console \
                --head main \
                --title "Sync main into console" \
                --body "Automated upstream sync of the current green \`main\` branch into the persistent \`console\` branch."
            )"

            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #$PR_NUMBER."
          else
            echo "Using existing sync PR #$PR_NUMBER."
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.state.outputs.sync == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TERRAKIT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge \
            "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
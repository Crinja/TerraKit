name: TerraKit CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrakit-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run TerraKit CI
        run: make ci

  platform:
    name: Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Build TerraKit C ABI
        run: cargo build -p terrakit-c-api --all-features

  gate:
    name: TerraKit Gate
    if: always()
  
    needs:
      - quality
      - platform
  
    runs-on: ubuntu-latest
  
    steps:
      - name: Check TerraKit CI result
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] \
            || [ "$PLATFORM_RESULT" != "success" ]; then
  
            echo "::error::TerraKit CI failed."
            exit 1
          fi
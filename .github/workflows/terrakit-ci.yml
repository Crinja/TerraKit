name: TerraKit CI

on:
  push:
    branches: [tk]
  pull_request:
    branches: [tk, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrakit-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  scope:
    name: TerraKit Scope
    uses: ./.github/workflows/_component-scope.yml
    with:
      branch: tk
      scope_mode: exclude
      scope_pattern: '^interfaces/|^\.github/(?!workflows/terrakit-.*\.ya?ml$)|^\.devcontainer/|^\.vscode/|^tools/release/|^docs/|^(README\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|LICENSE|\.gitignore|\.gitattributes|\.gitmodules|\.editorconfig|\.dockerignore|rust-toolchain\.toml)$'

  quality:
    name: Quality Gate
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run TerraKit CI
        run: make ci

  platform:
    name: Platform Smoke (${{ matrix.os }})
    needs: scope
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Build TerraKit C ABI
        run: cargo build -p terrakit-c-api --all-features

  gate:
    name: TerraKit Gate
    if: always()
    needs: [scope, quality, platform]
    runs-on: ubuntu-latest

    steps:
      - name: Check TerraKit CI result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]             || [ "$QUALITY_RESULT" != "success" ]             || [ "$PLATFORM_RESULT" != "success" ]; then
            echo "::error::TerraKit CI failed."
            echo "Scope:    $SCOPE_RESULT"
            echo "Quality:  $QUALITY_RESULT"
            echo "Platform: $PLATFORM_RESULT"
            exit 1
          fi

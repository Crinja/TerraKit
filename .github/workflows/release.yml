name: Release TerraKit

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-terrakit-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Validate core release
  # ===========================================================================

  validate:
    name: Validate TerraKit Release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install 1.87 \
            --profile minimal \
            --component rustfmt,clippy

      - name: Check tag matches TerraKit version
        id: version
        run: >
          cargo run
          --quiet
          -p terrakit-xtask
          --
          check-tag-version
          "$GITHUB_REF_NAME"

      - name: Run release gate
        run: make release-check


  # ===========================================================================
  # Standalone C ABI packages
  # ===========================================================================

  c-artifacts:
    name: C ABI (${{ matrix.name }})
    needs:
      - validate

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux
            os: ubuntu-latest

          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install 1.87 --profile minimal

      - name: Detect host target
        id: host
        run: >
          cargo run
          --quiet
          -p terrakit-xtask
          --
          host-target

      - name: Build release C ABI
        run: >
          cargo build
          -p terrakit-c-api
          --all-features
          --release

      - name: Install cbindgen
        run: >
          cargo install
          cbindgen
          --version 0.29.0
          --locked

      - name: Verify generated C header
        run: >
          cbindgen
          --verify
          --config engine/terrakit-c-api/cbindgen.toml
          --crate terrakit-c-api
          --output bindings/c/include/terrakit.h

      # -----------------------------------------------------------------------
      # Linux/macOS release C smoke
      # -----------------------------------------------------------------------

      - name: Release C smoke test
        if: runner.os != 'Windows'
        run: >
          make
          TARGET_DIR=target/release
          CARGO_BUILD_FLAGS=--release
          c-symbol-check
          c-example

      # -----------------------------------------------------------------------
      # Windows release C smoke
      # -----------------------------------------------------------------------

      - name: Release C smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"

          if not defined VSINSTALL (
            echo Visual Studio C++ toolchain was not found.
            exit /b 1
          )

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64

          if errorlevel 1 exit /b 1

          if not exist build\c mkdir build\c

          cl /nologo /W4 ^
            /Ibindings\c\include ^
            bindings\c\examples\generate_heightfield.c ^
            target\release\terrakit.dll.lib ^
            /Fe:build\c\generate_heightfield_release_msvc.exe

          if errorlevel 1 exit /b 1

          cl /nologo /EHsc /TP ^
            /Ibindings\c\include ^
            /c bindings\c\examples\header_smoke.cpp ^
            /Fo:build\c\header_cpp_release_msvc.obj

          if errorlevel 1 exit /b 1

          dumpbin /exports target\release\terrakit.dll > build\c\exports-release.txt

          findstr /C:"tk_get_abi_version" build\c\exports-release.txt
          if errorlevel 1 exit /b 1

          findstr /C:"tk_stage_registry_create_builtin" build\c\exports-release.txt
          if errorlevel 1 exit /b 1

          findstr /C:"tk_pipeline_assembler_finish" build\c\exports-release.txt
          if errorlevel 1 exit /b 1

          findstr /C:"tk_runtime_generate_2d" build\c\exports-release.txt
          if errorlevel 1 exit /b 1

          findstr /C:"tk_generation_result_get_mesh" build\c\exports-release.txt
          if errorlevel 1 exit /b 1

          set "PATH=%CD%\target\release;%PATH%"

          build\c\generate_heightfield_release_msvc.exe

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------

      - name: Package release C ABI
        run: >
          cargo run
          --quiet
          -p terrakit-xtask
          --
          package-c-api
          --target-dir target/release
          --target-triple "${{ steps.host.outputs.target }}"

      - name: Archive release C ABI
        run: >
          cargo run
          --quiet
          -p terrakit-xtask
          --
          archive-c-package
          --target-triple "${{ steps.host.outputs.target }}"

      - name: Upload C ABI archive
        uses: actions/upload-artifact@v7
        with:
          name: >-
            terrakit-c-api-${{
              needs.validate.outputs.version
            }}-${{
              steps.host.outputs.target
            }}
          path: |
            dist/archives/*.zip
            dist/archives/*.sha256
          if-no-files-found: error


  # ===========================================================================
  # GitHub release
  # ===========================================================================

  github-release:
    name: Publish TerraKit Release

    needs:
      - validate
      - c-artifacts

    runs-on: ubuntu-latest

    steps:
      - name: Create release directory
        run: mkdir -p dist/release

      - name: Download C ABI archives
        uses: actions/download-artifact@v8
        with:
          pattern: terrakit-c-api-*
          path: dist/release
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Publishing TerraKit release assets:"
          find dist/release -maxdepth 1 -type f -print | sort

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}

        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            gh release upload \
              "$RELEASE_TAG" \
              dist/release/* \
              --clobber

          else

            gh release create \
              "$RELEASE_TAG" \
              dist/release/* \
              --title "TerraKit $RELEASE_VERSION" \
              --generate-notes \
              --verify-tag

          fi
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install 1.87 --profile minimal --component rustfmt clippy

      - name: Check tag matches Cargo version
        id: version
        run: python scripts/ci/check_tag_version.py "$GITHUB_REF_NAME"

      - name: Run release gate
        run: make release-check

  c-artifacts:
    name: C ABI Artifacts (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.87 --profile minimal

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Detect host target
        id: host
        run: python -c "import os, subprocess; host = [line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host: ')][0]; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(f'target={host}\n')"

      - name: Build release C ABI
        run: cargo build -p terrakit-c-api --all-features --release

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.0 --locked

      - name: Check generated C header
        run: cbindgen --verify --config engine/terrakit-c-api/cbindgen.toml --crate terrakit-c-api --output bindings/c/include/terrakit.h

      - name: Release C smoke test
        if: runner.os != 'Windows'
        run: make TARGET_DIR=target/release CARGO_BUILD_FLAGS=--release c-symbol-check c-example

      - name: Release C smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -c "import os; os.makedirs('build/c', exist_ok=True)"
          cl /nologo /W4 /Ibindings\c\include bindings\c\examples\generate_heightfield.c target\release\terrakit.dll.lib /Fe:build\c\generate_heightfield_release_msvc.exe
          cl /nologo /EHsc /TP /Ibindings\c\include /c bindings\c\examples\header_smoke.cpp /Fo:build\c\header_cpp_release_msvc.obj
          dumpbin /exports target\release\terrakit.dll > build\c\exports-release.txt
          findstr /C:"tk_get_abi_version" build\c\exports-release.txt
          findstr /C:"tk_stage_registry_create_builtin" build\c\exports-release.txt
          findstr /C:"tk_pipeline_assembler_finish" build\c\exports-release.txt
          findstr /C:"tk_runtime_generate_2d" build\c\exports-release.txt
          findstr /C:"tk_generation_result_get_mesh" build\c\exports-release.txt
          set PATH=%CD%\target\release;%PATH%
          build\c\generate_heightfield_release_msvc.exe

      - name: Package release C ABI
        run: python scripts/ci/package_c_api.py --target-dir target/release --target-triple "${{ steps.host.outputs.target }}"

      - name: Archive release C ABI
        run: python scripts/ci/archive_c_package.py --target-triple "${{ steps.host.outputs.target }}"

      - name: Upload C ABI archive
        uses: actions/upload-artifact@v4
        with:
          name: terrakit-c-api-${{ needs.validate.outputs.version }}-${{ steps.host.outputs.target }}
          path: |
            dist/archives/*.zip
            dist/archives/*.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [validate, c-artifacts]
    runs-on: ubuntu-latest

    steps:
      - name: Download C ABI archives
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --title "TerraKit $RELEASE_VERSION" \
              --notes "Automated release for $RELEASE_TAG." \
              --verify-tag
          fi

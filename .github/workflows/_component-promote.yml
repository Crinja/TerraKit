name: Reusable Component Promote

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      branch:
        required: true
        type: string
      version_path:
        required: true
        type: string
      version_kind:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      scope_mode:
        required: true
        type: string
      scope_pattern:
        required: true
        type: string
    secrets:
      automation_token:
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote Version To Main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Fetch main
        shell: bash
        run: git fetch origin main --no-tags

      - name: Require current main
        id: ancestry
        shell: bash
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "This branch does not yet contain current main."
            echo "Promotion will wait for the main -> component sync workflow."
          fi

      - name: Verify component ownership
        if: steps.ancestry.outputs.current == 'true'
        shell: bash
        env:
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SCOPE_PATTERN: ${{ inputs.scope_pattern }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only origin/main...HEAD)"

          case "$SCOPE_MODE" in
            include)
              FORBIDDEN="$(
                printf '%s\n' "$CHANGED_FILES" \
                  | grep -v '^$' \
                  | grep -Ev "$SCOPE_PATTERN" \
                  || true
              )"
              ;;
            exclude)
              FORBIDDEN="$(
                printf '%s\n' "$CHANGED_FILES" \
                  | grep -v '^$' \
                  | grep -E "$SCOPE_PATTERN" \
                  || true
              )"
              ;;
            *)
              echo "::error::Unknown scope mode: $SCOPE_MODE"
              exit 1
              ;;
          esac

          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Persistent branch contains changes outside its ownership boundary."
            printf '%s\n' "$FORBIDDEN"
            exit 1
          fi

      - name: Compare component versions
        if: steps.ancestry.outputs.current == 'true'
        id: version
        shell: bash
        env:
          VERSION_PATH: ${{ inputs.version_path }}
          VERSION_KIND: ${{ inputs.version_kind }}
        run: |
          set -euo pipefail

          git show "origin/main:$VERSION_PATH" > /tmp/main-version-source

          python3 <<'PY'
          import configparser
          import os
          import re
          import tomllib

          path = os.environ["VERSION_PATH"]
          kind = os.environ["VERSION_KIND"]

          def read_version_bytes(data: bytes, kind: str) -> str:
              if kind == "cargo-workspace":
                  return tomllib.loads(data.decode())["workspace"]["package"]["version"]
              if kind == "cargo-package":
                  return tomllib.loads(data.decode())["package"]["version"]
              if kind == "godot-plugin":
                  parser = configparser.ConfigParser(interpolation=None)
                  parser.read_string(data.decode())
                  return parser["plugin"]["version"]
              raise SystemExit(f"unknown version kind: {kind}")

          def normalize_version(value: str) -> str:
              value = value.strip()
            
              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in {'"', "'"}
              ):
                  value = value[1:-1].strip()
          
              return value

          def semver(value: str):
              value = normalize_version(value)

              match = re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
                  value,
              )
          
              if match is None:
                  raise SystemExit(
                      f"release versions must use stable X.Y.Z SemVer; got {value!r}"
                  )
          
              return tuple(int(part) for part in match.groups())

          with open(path, "rb") as handle:
              current_version = read_version_bytes(handle.read(), kind)

          with open("/tmp/main-version-source", "rb") as handle:
              main_version = read_version_bytes(handle.read(), kind)

          current = semver(current_version)
          main = semver(main_version)

          print(f"main:      {main_version}")
          print(f"component: {current_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={current_version}\n")

              if current == main:
                  output.write("promote=false\n")
                  print("Version unchanged; no promotion required.")
              elif current < main:
                  raise SystemExit(
                      f"component version {current_version} is older than main version {main_version}"
                  )
              else:
                  output.write("promote=true\n")
                  print("Version increased; promotion required.")
          PY

      - name: Check release tag is unused
        if: >-
          steps.ancestry.outputs.current == 'true' &&
          steps.version.outputs.promote == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          TAG="${TAG_PREFIX}${RELEASE_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists."
            exit 1
          fi

      - name: Create or reuse promotion PR
        if: >-
          steps.ancestry.outputs.current == 'true' &&
          steps.version.outputs.promote == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.automation_token }}
          COMPONENT_BRANCH: ${{ inputs.branch }}
          COMPONENT_NAME: ${{ inputs.component }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$COMPONENT_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$COMPONENT_BRANCH" \
                --title "Release $COMPONENT_NAME $RELEASE_VERSION" \
                --body "Automated promotion of **$COMPONENT_NAME $RELEASE_VERSION** into the canonical \`main\` branch."
            )"
            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #$PR_NUMBER."
          else
            echo "Using existing promotion PR #$PR_NUMBER."
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: >-
          steps.ancestry.outputs.current == 'true' &&
          steps.version.outputs.promote == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.automation_token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge \
            "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge

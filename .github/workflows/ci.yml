name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-quality:
    name: Linux Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.87 --profile minimal --component rustfmt clippy

      - name: Run full CI gate
        run: make ci

  platform-smoke:
    name: Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.87 --profile minimal

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Build C ABI
        run: cargo build -p terrakit-c-api --all-features

      - name: Native C smoke test
        if: runner.os != 'Windows'
        run: make c-test

      - name: Install cbindgen
        if: runner.os == 'Windows'
        run: cargo install cbindgen --version 0.29.0 --locked

      - name: Check C header
        if: runner.os == 'Windows'
        run: cbindgen --verify --config engine/terrakit-c-api/cbindgen.toml --crate terrakit-c-api --output bindings/c/include/terrakit.h

      - name: Native C smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -c "import os; os.makedirs('build/c', exist_ok=True)"
          cl /nologo /W4 /Ibindings\c\include bindings\c\examples\generate_heightfield.c target\debug\terrakit.dll.lib /Fe:build\c\generate_heightfield_msvc.exe
          cl /nologo /EHsc /TP /Ibindings\c\include /c bindings\c\examples\header_smoke.cpp /Fo:build\c\header_cpp_msvc.obj
          dumpbin /exports target\debug\terrakit.dll > build\c\exports.txt
          findstr /C:"tk_get_abi_version" build\c\exports.txt
          findstr /C:"tk_stage_registry_create_builtin" build\c\exports.txt
          findstr /C:"tk_pipeline_assembler_finish" build\c\exports.txt
          findstr /C:"tk_runtime_generate_2d" build\c\exports.txt
          findstr /C:"tk_generation_result_get_mesh" build\c\exports.txt
          set PATH=%CD%\target\debug;%PATH%
          build\c\generate_heightfield_msvc.exe

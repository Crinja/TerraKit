name: TerraKit Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrakit-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare Release
    uses: ./.github/workflows/_release-state.yml
    with:
      version_path: Cargo.toml
      version_kind: cargo-workspace
      tag_prefix: terrakit-v

  validate:
    name: Validate Release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run release checks
        run: make release-check

  build:
    name: Build (${{ matrix.os }})
    needs: [prepare, validate]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Determine target triple
        id: target
        run: cargo run --quiet -p terrakit-xtask -- host-target

      - name: Build TerraKit C ABI
        run: cargo build --locked -p terrakit-c-api --all-features --release

      - name: Verify exported symbols
        run: >-
          cargo run --quiet -p terrakit-xtask --
          c-symbol-check
          --target-dir target/release

      - name: Package TerraKit C ABI
        run: >-
          cargo run --quiet -p terrakit-xtask --
          package-c-api
          --target-dir target/release
          --target-triple "${{ steps.target.outputs.target }}"

      - name: Create archive and checksum
        run: >-
          cargo run --quiet -p terrakit-xtask --
          archive-c-package
          --target-triple "${{ steps.target.outputs.target }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrakit-core-${{ steps.target.outputs.target }}
          path: dist/archives/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, validate, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terrakit-core-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVES="$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)"
          CHECKSUMS="$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)"
          [ "$ARCHIVES" -eq 3 ] || { echo "::error::Expected 3 archives, found $ARCHIVES"; exit 1; }
          [ "$CHECKSUMS" -eq 3 ] || { echo "::error::Expected 3 checksums, found $CHECKSUMS"; exit 1; }

      - name: Generate scoped release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          {
            echo "TerraKit ${VERSION}"
            echo
            echo "## TerraKit changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$GITHUB_SHA" -- . ':(exclude)interfaces/**')"
              if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No core-path changes recorded."; fi
            else
              echo "- Initial release in the terrakit-v* release line."
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create \
            "$TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TerraKit $VERSION" \
            --notes-file release-notes.md \
            --latest

name: TerraKit Release

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrakit-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.state.outputs.previous_tag }}
      release: ${{ steps.state.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Read TerraKit release information
        id: release
        run: cargo run --quiet -p terrakit-xtask -- release-info

      - name: Check release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Checking $RELEASE_TAG"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "$RELEASE_TAG is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote \
            --exit-code \
            --tags origin \
            "refs/tags/$RELEASE_TAG" \
            >/dev/null 2>&1
          then
            echo "::error::Tag $RELEASE_TAG exists, but no matching GitHub Release exists."
            exit 1
          fi

          PREVIOUS_TAG="$(
            git tag \
              --list 'terrakit-v*' \
              --sort=-v:refname \
              | head -n 1
          )"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous TerraKit release: $PREVIOUS_TAG"
          else
            echo "No previous TerraKit release found."
          fi

  validate:
    name: Validate Release
    needs: prepare

    if: needs.prepare.outputs.release == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run release checks
        run: make release-check

  build:
    name: Build (${{ matrix.os }})

    needs:
      - prepare
      - validate

    if: needs.prepare.outputs.release == 'true'

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Determine target triple
        id: target
        run: cargo run --quiet -p terrakit-xtask -- host-target

      - name: Build TerraKit C ABI
        run: cargo build --locked -p terrakit-c-api --all-features --release

      - name: Verify exported symbols
        run: >
          cargo run --quiet -p terrakit-xtask --
          c-symbol-check
          --target-dir target/release

      - name: Package TerraKit C ABI
        run: >
          cargo run --quiet -p terrakit-xtask --
          package-c-api
          --target-dir target/release
          --target-triple "${{ steps.target.outputs.target }}"

      - name: Create release archive
        id: archive
        run: >
          cargo run --quiet -p terrakit-xtask --
          archive-c-package
          --target-triple "${{ steps.target.outputs.target }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: terrakit-${{ steps.target.outputs.target }}
          path: dist/archives/*
          if-no-files-found: error

  publish:
    name: Publish Release

    needs:
      - prepare
      - validate
      - build

    if: needs.prepare.outputs.release == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terrakit-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print

          ARCHIVES="$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)"
          CHECKSUMS="$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)"

          if [ "$ARCHIVES" -ne 3 ]; then
            echo "::error::Expected 3 release archives, found $ARCHIVES."
            exit 1
          fi

          if [ "$CHECKSUMS" -ne 3 ]; then
            echo "::error::Expected 3 checksums, found $CHECKSUMS."
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          ARGS=(
            "$RELEASE_TAG"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "TerraKit $RELEASE_VERSION"
            --generate-notes
            --latest
          )

          if [ -n "$PREVIOUS_TAG" ]; then
            ARGS+=(
              --notes-start-tag "$PREVIOUS_TAG"
            )
          fi

          gh release create "${ARGS[@]}"
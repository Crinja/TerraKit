name: Godot CI

on:
  push:
    branches: [godot]
  pull_request:
    branches: [godot, tk, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  scope:
    name: Godot Scope
    uses: ./.github/workflows/_component-scope.yml
    with:
      branch: godot
      scope_mode: include
      scope_pattern: '^interfaces/terrakit-godot/'

  build:
    name: Build (${{ matrix.platform }})
    needs: scope
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build TerraKit debug C ABI
        run: cargo build -p terrakit-c-api --all-features

      - name: Build Godot debug extension
        working-directory: interfaces/terrakit-godot
        run: >-
          scons
          platform=${{ matrix.platform }}
          target=template_debug
          arch=x86_64
          terrakit_profile=debug

      - name: Build TerraKit release C ABI
        run: cargo build -p terrakit-c-api --all-features --release

      - name: Build Godot release extension
        working-directory: interfaces/terrakit-godot
        run: >-
          scons
          platform=${{ matrix.platform }}
          target=template_release
          arch=x86_64
          terrakit_profile=release

  gate:
    name: Godot Gate
    if: always()
    needs: [scope, build]
    runs-on: ubuntu-latest

    steps:
      - name: Check Godot CI result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ] \
            || [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Godot CI failed."
            echo "Scope: $SCOPE_RESULT"
            echo "Build: $BUILD_RESULT"
            exit 1
          fi

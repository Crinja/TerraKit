name: Unity Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: target/unity

jobs:
  prepare:
    name: Prepare Release
    uses: ./.github/workflows/_release-state.yml
    with:
      version_path: interfaces/terrakit-unity/package.json
      version_kind: json-package
      tag_prefix: terrakit-unity-v

  validate-source:
    name: Validate Unity Source
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate source-only package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="interfaces/terrakit-unity"
          NAME="$(jq -er '.name' "$ROOT/package.json")"
          VERSION="$(jq -er '.version' "$ROOT/package.json")"

          if [ "$NAME" != "com.terrakit.unity" ]; then
            echo "::error::package.json name must be com.terrakit.unity"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unity package version must be stable X.Y.Z SemVer; got '$VERSION'."
            exit 1
          fi

          NATIVE_FILES="$(find "$ROOT" -type f \( \
            -name '*.dll' -o \
            -name '*.so' -o \
            -name '*.dylib' -o \
            -name '*.lib' \
          \) -print)"

          if [ -n "$NATIVE_FILES" ]; then
            echo "::error::Compiled native libraries must not be committed to the Unity source package."
            printf '%s\n' "$NATIVE_FILES"
            exit 1
          fi

          BINARY_META="$(find "$ROOT" -type f \( \
            -name '*.dll.meta' -o \
            -name '*.so.meta' -o \
            -name '*.dylib.meta' -o \
            -name '*.lib.meta' \
          \) -print)"

          if [ -n "$BINARY_META" ]; then
            echo "::error::Binary-specific .meta files are generated by CI and must not be committed."
            printf '%s\n' "$BINARY_META"
            exit 1
          fi

          echo "TerraKit Unity source package is valid ($VERSION)."

  build:
    name: Build Native (${{ matrix.platform }})
    needs: [prepare, validate-source]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: libterrakit.so
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: terrakit.dll
          - os: macos-latest
            platform: macos-universal
            target: universal
            binary: libterrakit.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Rust target
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build TerraKit release C ABI
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked -p terrakit-c-api --all-features --release --target "$TARGET"

      - name: Collect native runtime
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p native-out
          cp "$CARGO_TARGET_DIR/$TARGET/release/$BINARY" "native-out/$BINARY"

      - name: Build universal macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked -p terrakit-c-api --all-features --release --target x86_64-apple-darwin
          cargo build --locked -p terrakit-c-api --all-features --release --target aarch64-apple-darwin
          mkdir -p native-out
          lipo -create \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/libterrakit.dylib" \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/libterrakit.dylib" \
            -output native-out/libterrakit.dylib
          lipo -info native-out/libterrakit.dylib

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: unity-native-${{ matrix.platform }}
          path: native-out/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, validate-source, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-windows-x86_64
          path: native/windows

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-linux-x86_64
          path: native/linux

      - uses: actions/download-artifact@v4
        with:
          name: unity-native-macos-universal
          path: native/macos

      - name: Assemble Unity package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf package release-assets
          mkdir -p package release-assets
          cp -a interfaces/terrakit-unity/. package/
          rm -f package/.gitignore

          install -Dm755 native/windows/terrakit.dll \
            package/Runtime/Plugins/Windows/x86_64/terrakit.dll
          install -Dm755 native/linux/libterrakit.so \
            package/Runtime/Plugins/Linux/x86_64/libterrakit.so
          install -Dm755 native/macos/libterrakit.dylib \
            package/Runtime/Plugins/macOS/libterrakit.dylib

          cat > package/Runtime/Plugins/Windows/x86_64/terrakit.dll.meta <<'EOF'
          fileFormatVersion: 2
          guid: e7209d2864a84adf9c75c4e5d2cdbdae
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 1
                  Exclude OSXUniversal: 1
                  Exclude Win: 1
                  Exclude Win64: 0
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: x86_64
                  DefaultValueInitialized: true
                  OS: Windows
            - first:
                Standalone: Linux64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 0
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 1
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          cat > package/Runtime/Plugins/Linux/x86_64/libterrakit.so.meta <<'EOF'
          fileFormatVersion: 2
          guid: 71b13022ba8f4e818207832f3d79131d
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 0
                  Exclude OSXUniversal: 1
                  Exclude Win: 1
                  Exclude Win64: 1
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: x86_64
                  DefaultValueInitialized: true
                  OS: Linux
            - first:
                Standalone: Linux64
              second:
                enabled: 1
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 0
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          cat > package/Runtime/Plugins/macOS/libterrakit.dylib.meta <<'EOF'
          fileFormatVersion: 2
          guid: 4d95e918819044c8ae897546dcf8b065
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                : Any
              second:
                enabled: 0
                settings:
                  Exclude Editor: 0
                  Exclude Linux64: 1
                  Exclude OSXUniversal: 0
                  Exclude Win: 1
                  Exclude Win64: 1
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  CPU: AnyCPU
                  DefaultValueInitialized: true
                  OS: OSX
            - first:
                Standalone: Linux64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 1
                settings:
                  CPU: AnyCPU
            - first:
                Standalone: Win
              second:
                enabled: 0
                settings:
                  CPU: x86
            - first:
                Standalone: Win64
              second:
                enabled: 0
                settings:
                  CPU: x86_64
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          PACKED="$(npm pack ./package --pack-destination release-assets --silent)"
          NAME="com.terrakit.unity-${VERSION}.tgz"

          if [ "$PACKED" != "$NAME" ]; then
            mv "release-assets/$PACKED" "release-assets/$NAME"
          fi

          tar -tzf "release-assets/$NAME" | grep -F 'package/Runtime/Plugins/Windows/x86_64/terrakit.dll'
          tar -tzf "release-assets/$NAME" | grep -F 'package/Runtime/Plugins/Linux/x86_64/libterrakit.so'
          tar -tzf "release-assets/$NAME" | grep -F 'package/Runtime/Plugins/macOS/libterrakit.dylib'

          if tar -tzf "release-assets/$NAME" | grep -Eq '\.lib$|/Build~/' ; then
            echo '::error::Release package contains source-only or non-runtime artifacts.'
            exit 1
          fi

          sha256sum "release-assets/$NAME" > "release-assets/$NAME.sha256"

      - name: Read bundled TerraKit version
        id: core
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { found=1; next }
            found && /^\[/ { exit }
            found && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate scoped release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          {
            echo "TerraKit Unity ${VERSION}"
            echo
            echo "Bundled TerraKit Core: ${CORE_VERSION}"
            echo
            echo "Native runtimes: Windows x86_64, Linux x86_64, macOS universal (x86_64 + arm64)."
            echo
            echo "Install the attached \`com.terrakit.unity-${VERSION}.tgz\` through Unity Package Manager."
            echo
            echo "## Unity changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$GITHUB_SHA" -- interfaces/terrakit-unity)"
              if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No Unity-path changes recorded."; fi
            else
              echo "- Initial standalone Unity release."
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create \
            "$TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TerraKit Unity $VERSION" \
            --notes-file release-notes.md \
            --latest=false
